<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grapevine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141F17;
    --ink-2:#1C2C21;
    --ink-3:#26392C;
    --paper:#F6F1E2;
    --paper-2:#EEE6D0;
    --vine:#74A85B;
    --vine-light:#9BC97F;
    --vine-dark:#456B34;
    --grape:#7C4E93;
    --grape-light:#A97CC0;
    --gold:#E8B23D;
    --clay:#C1592E;
    --text-light:#F3EEDD;
    --text-dim:#B9B29A;
    --text-dark:#1B2A1F;
    --font-display:'Fraunces', serif;
    --font-body:'Work Sans', sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--ink);
    color:var(--text-light);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;}
  p{margin:0;}
  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;border:none;}
  input{font-family:var(--font-body);}
  .hidden{display:none !important;}
  ::selection{background:var(--vine-dark);color:var(--text-light);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
 
  /* ---------- Layout shells ---------- */
  #root{min-height:100vh;}
 
  /* ---------- Landing Nav ---------- */
  .landing-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 6vw;position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg, rgba(20,31,23,0.96), rgba(20,31,23,0.85));
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(155,201,127,0.12);
    flex-wrap:wrap;row-gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.4rem;font-weight:700;letter-spacing:0.2px;}
  .brand .dot{color:var(--grape-light);} 
  .nav-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .nav-actions{display:flex;align-items:center;gap:14px;}
  .link-btn{background:none;color:var(--text-light);font-size:0.95rem;opacity:0.85;padding:8px 6px;}
  .link-btn:hover{opacity:1;text-decoration:underline;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:999px;font-weight:600;font-size:0.95rem;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary{background:var(--vine);color:var(--text-dark);box-shadow:0 6px 18px rgba(116,168,91,0.25);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(116,168,91,0.35);}
  .btn-ghost{background:transparent;color:var(--text-light);border:1.5px solid rgba(243,238,221,0.35);}
  .btn-ghost:hover{border-color:var(--text-light);}
  .btn-gold{background:var(--gold);color:var(--text-dark);box-shadow:0 6px 18px rgba(232,178,61,0.25);}
  .btn-gold:hover{transform:translateY(-2px);}
  .btn-small{padding:8px 16px;font-size:0.85rem;}
  .btn-block{width:100%;}
  .btn-disabled{background:var(--ink-3);color:var(--text-dim);cursor:not-allowed;box-shadow:none;}
  .btn-disabled:hover{transform:none;box-shadow:none;}
 
  /* ---------- Hero ---------- */
  .hero{
    position:relative;overflow:hidden;
    padding:8vh 6vw 10vh;
    display:grid;grid-template-columns:1.05fr 0.95fr;gap:40px;align-items:center;
  }
  .hero-backdrop{position:absolute;inset:0;z-index:-1;opacity:0.9;}
  .hero-eyebrow{
    font-size:0.78rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--vine-light);
    font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px;
  }
  .hero-eyebrow::before{content:"";width:22px;height:1.5px;background:var(--vine-light);display:inline-block;}
  .hero h1{
    font-size:clamp(2.4rem, 5vw, 4rem);line-height:1.04;letter-spacing:-0.01em;
    color:var(--text-light);
  }
  .hero h1 em{font-style:italic;color:var(--vine-light);} 
  .hero p.sub{
    margin-top:22px;font-size:1.15rem;line-height:1.6;color:var(--text-dim);max-width:46ch;
  }
  .hero-ctas{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
  .hero-note{margin-top:18px;font-size:0.85rem;color:var(--text-dim);opacity:0.8;}
 
  .vine-art{position:relative;height:520px;}
  .vine-art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 60% 50%, rgba(116,168,91,0.18), transparent 65%);z-index:-1;}
  .vine-art svg{width:100%;height:100%;}
 
  /* ---------- Vine divider ---------- */
  .vine-divider{width:100%;height:56px;max-width:1100px;margin:0 auto;opacity:0.85;}
  .vine-divider svg{width:100%;height:100%;display:block;}
 
  /* ---------- Features ---------- */
  .section{padding:7vh 6vw;}
  .section-head{max-width:640px;margin:0 auto 52px;text-align:center;}
  .section-head .eyebrow{
    font-size:0.78rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--grape-light);font-weight:600;margin-bottom:14px;
  }
  .section-head h2{font-size:clamp(1.7rem,3vw,2.4rem);color:var(--text-light);}
  .section-head p{margin-top:14px;color:var(--text-dim);font-size:1.05rem;line-height:1.6;}
 
  .feature-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:1100px;margin:0 auto;
  }
  .feature-card{
    background:var(--ink-2);border:1px solid rgba(155,201,127,0.1);
    border-radius:var(--radius);padding:30px 26px;
    transition:transform .2s ease, border-color .2s ease;
  }
  .feature-card:hover{transform:translateY(-4px);border-color:rgba(155,201,127,0.3);}
  .feature-card .icon{
    width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
  }
  .feature-card:nth-child(1) .icon{background:rgba(116,168,91,0.15);}
  .feature-card:nth-child(2) .icon{background:rgba(232,178,61,0.15);}
  .feature-card:nth-child(3) .icon{background:rgba(124,78,147,0.18);}
  .feature-card:nth-child(4) .icon{background:rgba(169,124,192,0.2);}
  .feature-card h3{font-size:1.15rem;color:var(--text-light);margin-bottom:10px;}
  .feature-card p{color:var(--text-dim);font-size:0.95rem;line-height:1.55;}
 
  /* ---------- Path preview (landing) ---------- */
  .path-preview{
    max-width:960px;margin:0 auto;background:var(--ink-2);border:1px solid rgba(155,201,127,0.1);
    border-radius:20px;padding:44px;display:flex;align-items:center;gap:40px;
  }
  .path-preview-visual{flex:0 0 240px;}
  .path-preview-copy h3{color:var(--text-light);font-size:1.4rem;margin-bottom:12px;}
  .path-preview-copy p{color:var(--text-dim);line-height:1.6;font-size:1rem;}
  .tier-chip-row{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .tier-chip{
    font-size:0.82rem;padding:8px 14px;border-radius:999px;background:var(--ink-3);color:var(--text-dim);
    border:1px solid rgba(155,201,127,0.14);width:fit-content;
  }
 
  footer{padding:40px 6vw;border-top:1px solid rgba(155,201,127,0.1);display:flex;justify-content:space-between;align-items:center;color:var(--text-dim);font-size:0.85rem;flex-wrap:wrap;gap:12px;}
 
  /* ---------- Auth ---------- */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 6vw;
    background:
      radial-gradient(circle at 15% 20%, rgba(116,168,91,0.14), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(124,78,147,0.14), transparent 45%),
      var(--ink);
  }
  .auth-card{
    width:100%;max-width:420px;background:var(--ink-2);border:1px solid rgba(155,201,127,0.12);
    border-radius:20px;padding:40px 36px;position:relative;
  }
  .auth-card .brand{justify-content:center;margin-bottom:6px;}
  .auth-card .auth-sub{text-align:center;color:var(--text-dim);font-size:0.92rem;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.82rem;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  .field input{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(155,201,127,0.18);
    background:var(--ink-3);color:var(--text-light);font-size:0.95rem;outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus{border-color:var(--vine-light);} 
  .auth-method-toggle{
    display:flex;gap:6px;background:var(--ink-3);border-radius:10px;padding:4px;margin-bottom:20px;
  }
  .auth-method-tab{
    flex:1;background:none;color:var(--text-dim);padding:9px 10px;border-radius:7px;
    font-size:0.85rem;font-weight:600;transition:all .15s ease;
  }
  .auth-method-tab.active{background:var(--ink-2);color:var(--text-light);box-shadow:0 2px 8px rgba(0,0,0,0.25);}
  .auth-method-tab:hover:not(.active){color:var(--text-light);}
  .auth-error{
    background:rgba(193,89,46,0.14);border:1px solid rgba(193,89,46,0.4);color:#F0B79B;
    padding:10px 14px;border-radius:10px;font-size:0.85rem;margin-bottom:16px;
  }
  .auth-switch{text-align:center;margin-top:20px;font-size:0.88rem;color:var(--text-dim);}
  .auth-switch button{background:none;color:var(--vine-light);font-weight:600;padding:0;}
  .auth-back{position:absolute;top:20px;left:20px;background:none;color:var(--text-dim);font-size:0.85rem;}
  .auth-back:hover{color:var(--text-light);}
  .auth-demo-note{
    margin-top:22px;font-size:0.76rem;color:var(--text-dim);opacity:0.75;text-align:center;line-height:1.5;
  }
 
  /* ---------- Plans / upgrade page ---------- */
  .plans-wrap{min-height:100vh;padding-bottom:8vh;}
  .plans-hero{max-width:640px;margin:6vh auto 5vh;text-align:center;padding:0 6vw;}
  .plans-hero .hero-eyebrow{justify-content:center;}
  .plans-hero h1{font-size:clamp(2rem,4vw,2.8rem);color:var(--text-light);margin:14px 0;}
  .plans-hero p{color:var(--text-dim);font-size:1.05rem;line-height:1.6;}
  .plans-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1080px;margin:0 auto;padding:0 6vw;
    align-items:stretch;
  }
  .plan-card{
    background:var(--ink-2);border:1.5px solid rgba(155,201,127,0.14);border-radius:20px;
    padding:34px 26px 26px;display:flex;flex-direction:column;position:relative;
  }
  .plan-card.featured{border-color:rgba(232,178,61,0.5);box-shadow:0 12px 30px rgba(232,178,61,0.12);}
  .plan-badge{
    position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:var(--text-dark);font-size:0.72rem;font-weight:700;
    padding:5px 14px;border-radius:999px;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;
  }
  .plan-card h3{color:var(--text-light);font-size:1.3rem;margin-bottom:8px;}
  .plan-tagline{color:var(--text-dim);font-size:0.9rem;line-height:1.5;margin-bottom:20px;min-height:2.7em;}
  .plan-price{display:flex;align-items:baseline;gap:4px;margin-bottom:22px;}
  .plan-price .amount{font-family:var(--font-display);font-size:2.1rem;color:var(--text-light);font-weight:600;}
  .plan-price .period{color:var(--text-dim);font-size:0.9rem;}
  .plan-features{list-style:none;padding:0;margin:0 0 26px;flex:1;display:flex;flex-direction:column;gap:12px;}
  .plan-features li{display:flex;align-items:flex-start;gap:10px;color:var(--text-dim);font-size:0.9rem;line-height:1.4;}
  .plan-features li svg{flex:0 0 auto;color:var(--vine-light);margin-top:3px;}
  .plans-notice{
    max-width:520px;margin:28px auto 0;text-align:center;background:rgba(232,178,61,0.12);
    border:1px solid rgba(232,178,61,0.35);color:var(--gold);padding:12px 18px;border-radius:12px;font-size:0.9rem;
  }
  .plans-footnote{text-align:center;color:var(--text-dim);opacity:0.7;font-size:0.8rem;margin-top:24px;padding:0 6vw;}
 
  /* ---------- App shell ---------- */
  .app-shell{min-height:100vh;display:flex;flex-direction:column;background:
    radial-gradient(1200px 500px at 10% -10%, rgba(116,168,91,0.16), transparent 55%),
    radial-gradient(900px 420px at 110% 0%, rgba(124,78,147,0.16), transparent 50%),
    var(--ink);
    position:relative;
  }
  .app-shell::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.35;
    background-image:radial-gradient(circle at 20% 80%, rgba(155,201,127,0.08) 0 1px, transparent 2px);
    background-size:48px 48px;
  }
  .app-shell > *{position:relative;z-index:1;}
  .app-topbar{
    display:flex;align-items:center;justify-content:space-between;padding:16px 4vw;
    border-bottom:1px solid rgba(155,201,127,0.12);position:sticky;top:0;background:rgba(20,31,23,0.97);
    backdrop-filter:blur(6px);z-index:30;gap:20px;flex-wrap:wrap;
  }
  .app-topbar .brand{font-size:1.2rem;}
  .app-topbar-brand{display:flex;align-items:center;gap:14px;}
  .stat-pills{display:flex;align-items:center;gap:14px;}
  .pill{
    display:flex;align-items:center;gap:8px;background:var(--ink-2);border:1px solid rgba(155,201,127,0.14);
    padding:8px 14px;border-radius:999px;font-size:0.9rem;font-weight:600;
  }
  .pill.streak{color:var(--gold);}
  .pill.level{color:var(--vine-light);} 
  .xp-bar-wrap{
    width:120px;height:6px;background:var(--ink-3);border-radius:999px;overflow:hidden;margin-left:6px;
  }
  .xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--vine-dark),var(--vine-light));border-radius:999px;transition:width .5s ease;}
  .avatar-menu{position:relative;}
  .avatar-btn{
    width:38px;height:38px;border-radius:50%;background:var(--grape);color:var(--text-light);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.95rem;
    overflow:hidden;padding:0;border:1.5px solid rgba(155,201,127,0.35);
  }
  .avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-btn.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,178,61,0.35);}
  .page-head{position:relative;margin-bottom:8px;}
  .page-head .social-hero{padding-right:168px;text-align:left;max-width:none;}
  .page-head .social-hero h2,.page-head .social-hero p{max-width:46ch;}
  .page-corner-btn{position:absolute;top:8px;right:0;z-index:3;white-space:nowrap;}
 
  .app-tabs{display:flex;gap:6px;padding:14px 4vw 0;border-bottom:1px solid rgba(155,201,127,0.1);overflow-x:auto;scrollbar-width:none;}
  .app-tabs::-webkit-scrollbar{display:none;}
  .app-tab{
    background:none;color:var(--text-dim);padding:12px 18px;font-size:0.92rem;font-weight:600;
    border-bottom:3px solid transparent;border-radius:8px 8px 0 0;white-space:nowrap;
  }
  .app-tab.active{color:var(--text-light);border-color:var(--vine);}
  .app-tab:hover{color:var(--text-light);}
 
  .app-main{flex:1;padding:5vh 4vw 8vh;max-width:1100px;margin:0 auto;width:100%;}
 
  /* ---------- Back button (dish flow) ---------- */
  .back-btn{
    background:none;color:var(--text-light);padding:8px 14px;border:1px solid rgba(155,201,127,0.3);
    border-radius:8px;margin-bottom:20px;cursor:pointer;font-weight:600;font-size:0.9rem;transition:all .2s ease;
  }
  .back-btn:hover{background:var(--ink-2);border-color:var(--vine-light);}
 
  /* ---------- Placeholder photo: dish nodes (grid / path) ---------- */
  .node-photo{
    width:100%;height:100%;position:relative;border-radius:inherit;overflow:hidden;
    background:linear-gradient(135deg, var(--ink-3), var(--ink-2));
    display:flex;align-items:center;justify-content:center;
  }
  .node-photo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;}
  .node-photo-placeholder{color:var(--text-dim);opacity:0.4;position:relative;}
  .node-photo-emoji{
    position:absolute;bottom:6%;right:6%;border-radius:50%;z-index:2;
    background:rgba(20,31,23,0.75);display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(155,201,127,0.3);line-height:1;
  }
 
  /* ---------- Placeholder photo: banner (top of recipe pages) ---------- */
  .dish-banner{
    position:relative;width:100%;height:280px;border-radius:20px;overflow:hidden;
    background:linear-gradient(135deg, var(--ink-2), var(--ink-3));margin-bottom:28px;
    border:1px solid rgba(155,201,127,0.14);
  }
  .dish-banner.compact{height:150px;margin-bottom:22px;}
  .dish-banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;z-index:1;background:var(--ink-2);}
  .dish-banner-placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-dim);
  }
  .dish-banner-placeholder span{font-size:0.76rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;opacity:0.6;}
  .dish-banner-emoji{
    position:absolute;top:16px;left:16px;width:46px;height:46px;border-radius:50%;z-index:2;
    background:rgba(20,31,23,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
    font-size:1.4rem;border:1px solid rgba(155,201,127,0.25);
  }
 
  /* ---------- Recipe overview page ---------- */
  .recipe-page{max-width:760px;margin:0 auto;}
  .recipe-header .eyebrow{font-size:0.75rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px;}
  .recipe-header h2{font-size:2rem;color:var(--text-light);margin-bottom:10px;}
  .recipe-desc{color:var(--text-dim);font-size:1rem;line-height:1.6;margin-bottom:18px;max-width:60ch;}
  .done-note{color:var(--vine-light);margin-bottom:16px;font-size:0.92rem;}
  .today-meta{display:flex;gap:16px;color:var(--text-dim);font-size:0.88rem;margin-bottom:22px;flex-wrap:wrap;}
  .today-meta span{display:flex;align-items:center;gap:6px;}
 
  .all-done-card{
    background:var(--ink-2);border:1px dashed rgba(155,201,127,0.3);border-radius:22px;padding:60px 40px;text-align:center;
  }
  .all-done-card .big-emoji{font-size:3rem;margin-bottom:14px;}
 
  /* ---------- Cooking page ---------- */
  .cooking-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;max-width:900px;margin-left:auto;margin-right:auto;}
  .cooking-header h2{font-size:1.6rem;color:var(--text-light);}
  .steps-progress{font-size:0.85rem;color:var(--text-dim);background:var(--ink-2);border:1px solid rgba(155,201,127,0.16);padding:6px 14px;border-radius:999px;}
  .steps-progress b{color:var(--vine-light);}
 
  .dish-detail{
    display:grid;grid-template-columns:1fr 1fr;gap:34px;background:var(--ink-2);border:1px solid rgba(155,201,127,0.12);
    border-radius:20px;padding:34px;max-width:900px;margin:0 auto;
  }
  .dish-detail h3{color:var(--text-light);font-size:1.15rem;margin-bottom:14px;}
 
  /* ---------- Yield / serving-size control (cooking page) ---------- */
  .yield-control{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:16px;padding:10px 14px;background:var(--ink-3);
    border:1px solid rgba(155,201,127,0.18);border-radius:12px;flex-wrap:wrap;
  }
  .yield-current{font-size:0.85rem;color:var(--text-dim);}
  .yield-current b{color:var(--text-light);font-weight:700;}
  .yield-options{display:flex;gap:6px;}
  .yield-opt{
    background:var(--ink-2);color:var(--text-dim);border:1.5px solid rgba(155,201,127,0.22);
    border-radius:8px;padding:5px 12px;font-size:0.82rem;font-weight:700;min-width:32px;
    transition:all .15s ease;
  }
  .yield-opt:hover{border-color:var(--vine-light);color:var(--text-light);}
  .yield-opt.active{background:var(--vine);border-color:var(--vine);color:var(--text-dark);}
 
  .complete-btn-row{grid-column:1 / -1;display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:6px;flex-wrap:wrap;}
  .cooked-chip{display:flex;align-items:center;gap:8px;color:var(--vine-light);font-weight:600;font-size:0.95rem;}
 
  /* ---------- Checklist (ingredients + instructions) ---------- */
  .check-list{list-style:none;padding:0;margin:0;}
  .scroll-list{max-height:360px;overflow-y:auto;padding-right:10px;margin-right:-10px;}
  .scroll-list::-webkit-scrollbar{width:8px;}
  .scroll-list::-webkit-scrollbar-track{background:transparent;}
  .scroll-list::-webkit-scrollbar-thumb{background:rgba(155,201,127,0.25);border-radius:8px;}
  .scroll-list::-webkit-scrollbar-thumb:hover{background:rgba(155,201,127,0.4);}
  .check-item{
    display:flex;align-items:flex-start;gap:12px;padding:10px 4px;
    border-bottom:1px solid rgba(155,201,127,0.08);cursor:pointer;user-select:none;
  }
  .check-item:last-child{border-bottom:none;}
  .check-item.readonly{cursor:default;}
  .check-badge{
    flex:0 0 auto;width:24px;height:24px;border-radius:8px;
    background:var(--ink-3);border:1.5px solid rgba(155,201,127,0.3);
    display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;color:var(--text-dim);
    transition:all .15s ease;margin-top:1px;
  }
  .check-badge.step-badge{border-radius:50%;}
  .check-item.checked .check-badge{background:var(--vine);border-color:var(--vine);color:var(--text-dark);}
  .check-text{font-size:0.94rem;line-height:1.55;color:var(--text-dim);padding-top:1px;}
  .check-item.checked .check-text{color:var(--text-light);}
 
  /* ---------- Path view ---------- */
  .dish-node-row{display:flex;justify-content:center;gap:52px;margin-bottom:56px;flex-wrap:wrap;align-items:flex-start;position:relative;z-index:1;}
  .dish-node{position:relative;display:flex;flex-direction:column;align-items:center;}
  .dish-circle-btn{
    border-radius:14px;overflow:hidden;padding:0;position:relative;display:block;
    border:3px solid rgba(155,201,127,0.22);background:var(--ink-3);
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, opacity .18s ease;
  }
  .dish-circle-btn:not(:disabled):hover{transform:scale(1.06);box-shadow:0 10px 22px rgba(0,0,0,0.4);border-color:var(--vine-light);}
  .dish-circle-btn.done{border-color:var(--vine-light);opacity:0.68;}
  .dish-circle-btn.locked{opacity:0.35;cursor:not-allowed;filter:grayscale(0.7);}
  .dish-circle-btn.current{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(232,178,61,0.16), 0 8px 20px rgba(232,178,61,0.28);
    animation:pulseGold 2.6s infinite;
  }
  @keyframes pulseGold{
    0%,100%{box-shadow:0 0 0 0 rgba(232,178,61,0.35), 0 8px 20px rgba(232,178,61,0.22);}
    50%{box-shadow:0 0 0 9px rgba(232,178,61,0), 0 8px 20px rgba(232,178,61,0.22);}
  }
  .done-badge{
    position:absolute;top:-4px;right:-4px;width:26px;height:26px;border-radius:50%;
    background:var(--vine);color:var(--text-dark);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;border:2px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,0.4);z-index:3;
  }
  .dish-node-name{font-weight:600;color:var(--text-light);text-align:center;font-size:0.92rem;margin-top:12px;line-height:1.25;}
  .dish-node-meta{color:var(--text-dim);font-size:0.8rem;text-align:center;margin-top:3px;}
  .dish-node-status{font-size:0.76rem;text-align:center;margin-top:4px;font-weight:600;}
  .dish-node-status.done{color:var(--vine-light);}
  .dish-node-status.locked{color:var(--text-dim);opacity:0.65;font-style:italic;}
  .dish-node-status.ready{color:var(--gold);}
 
  .path-container{position:relative;padding:8px 0 40px;}
  .path-bg-vine{position:absolute;inset:0;z-index:0;opacity:0.5;pointer-events:none;}
  .tier-marker{
    display:flex;align-items:center;gap:14px;margin:40px 0 34px;color:var(--grape-light);position:relative;z-index:1;
  }
  .tier-marker .line{flex:1;height:1px;background:linear-gradient(90deg, transparent, rgba(124,78,147,0.4), transparent);}
  .tier-marker .label{font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;white-space:nowrap;}
 
  /* ---------- Profile view ---------- */
  .profile-header{display:flex;align-items:center;gap:24px;margin-bottom:36px;flex-wrap:wrap;}
  .profile-avatar{
    width:96px;height:96px;border-radius:50%;background:var(--grape);display:flex;align-items:center;justify-content:center;
    font-size:2rem;font-weight:700;color:var(--text-light);flex:0 0 auto;position:relative;overflow:hidden;
    border:3px solid rgba(155,201,127,0.35);box-shadow:0 0 0 8px rgba(116,168,91,0.08);cursor:pointer;
  }
  .profile-header h2{font-size:1.7rem;color:var(--text-light);}
  .profile-header .level-label{color:var(--vine-light);font-weight:600;font-size:0.95rem;margin-top:4px;}
 
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px;}
  .stat-box{background:var(--ink-2);border:1px solid rgba(155,201,127,0.1);border-radius:14px;padding:20px;text-align:center;}
  .stat-box .num{font-family:var(--font-display);font-size:1.9rem;color:var(--text-light);}
  .stat-box .lbl{font-size:0.78rem;color:var(--text-dim);margin-top:4px;text-transform:uppercase;letter-spacing:0.06em;}
 
  .heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-bottom:40px;}
  .heat-cell{aspect-ratio:1;border-radius:4px;background:var(--ink-3);}
  .heat-cell.on{background:var(--vine);}
 
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .badge-card{
    background:var(--ink-2);border:1px solid rgba(155,201,127,0.1);border-radius:14px;padding:18px;text-align:center;
    opacity:0.35;
  }
  .badge-card.earned{opacity:1;border-color:rgba(232,178,61,0.4);}
  .badge-card .b-icon{font-size:2rem;margin-bottom:8px;}
  .badge-card h5{font-size:0.85rem;color:var(--text-light);margin-bottom:4px;}
  .badge-card p{font-size:0.72rem;color:var(--text-dim);line-height:1.4;}
 
  h3.section-title{font-size:1.05rem;color:var(--text-light);margin-bottom:16px;letter-spacing:0.02em;}
 
  /* ---------- Recipe completed page ---------- */
  .completed-page{max-width:600px;margin:20px auto 60px;text-align:center;}
  .completed-emoji{font-size:3rem;margin-bottom:10px;}
  .completed-page h2{font-size:2rem;color:var(--text-light);margin-bottom:10px;}
  .completed-sub{color:var(--text-dim);font-size:1.05rem;line-height:1.6;}
  .completed-sub b{color:var(--text-light);}
  .completed-level{color:var(--gold);font-weight:700;margin-top:12px;font-size:1.05rem;}
  .completed-badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .completed-badge-chip{background:var(--ink-2);border:1px solid rgba(232,178,61,0.4);border-radius:999px;padding:8px 16px;font-size:0.85rem;color:var(--gold);font-weight:600;}
  .completed-actions{display:flex;gap:14px;justify-content:center;margin-top:32px;flex-wrap:wrap;}
 
  @keyframes confettiFall{to{transform:translateY(100vh) rotate(720deg);opacity:0;}}
 
  /* ---------- Learn page (kitchen tools) ---------- */
  .learn-intro{max-width:640px;margin:0 auto 40px;text-align:center;}
  .learn-intro h2{color:var(--text-light);margin-bottom:8px;}
  .learn-intro p{color:var(--text-dim);line-height:1.6;}
  .learn-sections{display:flex;flex-direction:column;gap:28px;max-width:820px;margin:0 auto;}
  .learn-section{
    background:var(--ink-2);border:1px solid rgba(155,201,127,0.12);border-radius:20px;
    padding:28px;scroll-margin-top:100px;
  }
  .learn-section.highlight{border-color:var(--vine-light);box-shadow:0 0 0 1px rgba(155,201,127,0.2);} 
  .learn-section h3{color:var(--text-light);font-size:1.25rem;margin-bottom:8px;}
  .learn-section .learn-desc{color:var(--text-dim);font-size:0.95rem;line-height:1.55;margin-bottom:18px;}
  .learn-video{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
    background:linear-gradient(135deg, var(--ink-3), var(--ink-2));
    border:1px solid rgba(155,201,127,0.14);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-dim);
  }
  .learn-video-icon{
    width:56px;height:56px;border-radius:50%;background:rgba(116,168,91,0.18);
    display:flex;align-items:center;justify-content:center;color:var(--vine-light);
  }
  .learn-video-label{font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;opacity:0.7;}
  .learn-tips{margin-top:16px;padding:14px 16px;background:var(--ink-3);border-radius:12px;border:1px solid rgba(155,201,127,0.1);}
  .learn-tips h4{font-size:0.82rem;color:var(--gold);margin-bottom:8px;letter-spacing:0.06em;text-transform:uppercase;}
  .learn-tips ul{margin:0;padding-left:18px;color:var(--text-dim);font-size:0.88rem;line-height:1.6;}
 
  /* ---------- Tool links on cooking page ---------- */
  .tool-links{
    grid-column:1 / -1;display:flex;align-items:center;flex-wrap:wrap;gap:8px;
    padding:12px 14px;background:var(--ink-3);border-radius:12px;border:1px solid rgba(155,201,127,0.14);
    margin-bottom:4px;
  }
  .tool-links-label{font-size:0.82rem;color:var(--text-dim);font-weight:600;margin-right:4px;}
  .tool-link-btn{
    background:var(--ink-2);color:var(--vine-light);border:1px solid rgba(155,201,127,0.25);
    border-radius:999px;padding:5px 12px;font-size:0.78rem;font-weight:600;
    transition:all .15s ease;
  }
  .tool-link-btn:hover{background:var(--vine);color:var(--text-dark);border-color:var(--vine);}
 
  /* ---------- Leaderboard ---------- */
  .leaderboard-list{display:flex;flex-direction:column;gap:10px;}
  .leaderboard-row{
    display:flex;align-items:center;gap:14px;background:linear-gradient(180deg, rgba(38,57,44,0.9), var(--ink-2));
    border:1px solid rgba(155,201,127,0.12);border-radius:16px;padding:14px 18px;
    transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    animation:rowIn .45s ease both;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit;
    position:relative;overflow:hidden;appearance:none;-webkit-appearance:none;
  }
  .leaderboard-row::after{
    content:"";position:absolute;inset:0 auto 0 -40%;width:30%;
    background:linear-gradient(90deg, transparent, rgba(243,238,221,0.06), transparent);
    transform:translateX(-120%);
  }
  .leaderboard-row:hover{transform:translateX(4px);border-color:rgba(155,201,127,0.4);box-shadow:0 10px 24px rgba(0,0,0,0.25);}
  .leaderboard-row:hover::after{animation:rowShine .7s ease;}
  @keyframes rowShine{to{transform:translateX(420%);}}
  .leaderboard-row.me{
    border-color:rgba(232,178,61,0.7);
    box-shadow:0 0 0 1px rgba(232,178,61,0.25), 0 12px 28px rgba(232,178,61,0.12);
    background:linear-gradient(180deg, rgba(232,178,61,0.12), var(--ink-2));
  }
  .lb-rank{width:26px;flex:0 0 auto;text-align:center;font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:var(--vine-light);}
  .leaderboard-row.rank-1 .lb-rank{color:var(--gold);}
  .leaderboard-row.rank-2 .lb-rank{color:#D7D0BC;}
  .leaderboard-row.rank-3 .lb-rank{color:#C98A5B;}
  .lb-avatar{
    width:42px;height:42px;border-radius:50%;background:var(--grape);color:var(--text-light);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;flex:0 0 auto;
    overflow:hidden;border:2px solid rgba(155,201,127,0.28);box-shadow:0 0 0 3px rgba(116,168,91,0.08);
  }
  .lb-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .lb-name{flex:1;font-weight:600;color:var(--text-light);min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .lb-name .rank-bar{flex:1 1 100%;width:100%;margin-top:2px;}
  .lb-level{color:var(--text-dim);font-size:0.82rem;flex:0 0 auto;}
  .lb-xp{color:var(--gold);font-weight:700;font-size:0.92rem;min-width:64px;text-align:right;flex:0 0 auto;}
  .leaderboard-empty{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .you-chip{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--gold);color:var(--text-dark);font-size:0.68rem;font-weight:800;
    letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;
    box-shadow:0 0 0 3px rgba(232,178,61,0.18);animation:youPop .45s ease;
  }
  @keyframes youPop{from{transform:scale(.6);opacity:0;}to{transform:none;opacity:1;}}
  @keyframes rowIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ---------- Social: weekly, people, groups, profiles ---------- */
  .social-hero{text-align:center;margin-bottom:28px;position:relative;padding:8px 0 4px;}
  .social-hero .hero-glow{
    position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:280px;height:80px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,178,61,0.18), transparent 70%);
    pointer-events:none;
  }
  .social-hero h2{color:var(--text-light);margin-bottom:8px;position:relative;}
  .social-hero p{color:var(--text-dim);line-height:1.55;position:relative;}
  .week-chip{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;
    background:rgba(232,178,61,0.12);border:1px solid rgba(232,178,61,0.35);
    color:var(--gold);padding:8px 14px;border-radius:999px;font-size:0.82rem;font-weight:600;
  }
  .week-chip .pulse-dot{
    width:8px;height:8px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 0 rgba(232,178,61,0.6);animation:dotPulse 1.8s infinite;
  }
  @keyframes dotPulse{
    0%{box-shadow:0 0 0 0 rgba(232,178,61,0.55);}
    70%{box-shadow:0 0 0 8px rgba(232,178,61,0);}
    100%{box-shadow:0 0 0 0 rgba(232,178,61,0);}
  }
  .mode-toggle{
    display:inline-flex;background:var(--ink-2);border:1px solid rgba(155,201,127,0.16);
    border-radius:999px;padding:4px;gap:4px;margin:0 auto 28px;display:flex;width:fit-content;
  }
  .mode-toggle button{
    background:none;color:var(--text-dim);padding:8px 16px;border-radius:999px;font-size:0.85rem;font-weight:600;
  }
  .mode-toggle button.active{background:var(--vine);color:var(--text-dark);}
  .podium{
    display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;
    max-width:720px;margin:0 auto 36px;
  }
  .podium-card{
    background:linear-gradient(180deg, rgba(38,57,44,0.95), var(--ink-2));border:1px solid rgba(155,201,127,0.14);border-radius:18px;
    padding:18px 12px 16px;text-align:center;cursor:pointer;width:100%;color:inherit;font:inherit;
    animation:podiumUp .7s cubic-bezier(.2,1.1,.3,1) both;
    appearance:none;-webkit-appearance:none;
    transition:transform .2s ease, border-color .2s ease;
  }
  .podium-card:hover{transform:translateY(-6px);border-color:rgba(155,201,127,0.4);}
  .podium-card.p1{order:2;padding-top:26px;border-color:rgba(232,178,61,0.55);box-shadow:0 16px 40px rgba(232,178,61,0.12);animation-delay:.08s;}
  .podium-card.p2{order:1;animation-delay:.16s;}
  .podium-card.p3{order:3;animation-delay:.24s;}
  @keyframes podiumUp{from{opacity:0;transform:translateY(28px) scale(.96);}to{opacity:1;transform:none;}}
  .podium-place{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin-bottom:10px;}
  .podium-card.p1 .podium-place{color:var(--gold);}
  .podium-avatar{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;border:3px solid rgba(155,201,127,0.3);}
  .podium-card.p1 .podium-avatar{width:78px;height:78px;border-color:var(--gold);box-shadow:0 0 0 6px rgba(232,178,61,0.15);animation:goldGlow 2.8s ease-in-out infinite;}
  @keyframes goldGlow{
    0%,100%{box-shadow:0 0 0 6px rgba(232,178,61,0.12);}
    50%{box-shadow:0 0 22px 8px rgba(232,178,61,0.28);}
  }
  .podium-avatar img{width:100%;height:100%;object-fit:cover;}
  .podium-name{font-weight:700;color:var(--text-light);font-size:0.95rem;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .podium-score{color:var(--gold);font-weight:700;margin-top:4px;font-size:0.9rem;}
  .search-row{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .search-row input{
    flex:1;min-width:180px;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(155,201,127,0.18);
    background:var(--ink-2);color:var(--text-light);font-size:0.95rem;outline:none;
  }
  .search-row input:focus{border-color:var(--vine-light);} 
  .people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .person-card{
    background:var(--ink-2);border:1px solid rgba(155,201,127,0.12);border-radius:18px;padding:22px 18px;
    text-align:center;cursor:pointer;transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    animation:rowIn .5s ease both;
  }
  .person-card:hover{transform:translateY(-6px);border-color:rgba(155,201,127,0.4);box-shadow:0 14px 28px rgba(0,0,0,0.28);}
  .person-card .pc-avatar{
    width:72px;height:72px;border-radius:50%;margin:0 auto 12px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;
    border:2px solid rgba(155,201,127,0.28);
  }
  .person-card .pc-avatar img{width:100%;height:100%;object-fit:cover;}
  .person-card h3{font-size:1.05rem;color:var(--text-light);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .person-card .pc-bio{color:var(--text-dim);font-size:0.82rem;line-height:1.45;margin-top:8px;min-height:2.4em;}
  .person-meta{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .mini-stat{background:var(--ink-3);border-radius:999px;padding:4px 10px;font-size:0.72rem;color:var(--text-dim);font-weight:600;}
  .groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .group-card{
    background:var(--ink-2);border:1px solid rgba(155,201,127,0.12);border-radius:18px;padding:22px;
    cursor:pointer;transition:transform .22s ease, border-color .22s ease;
    position:relative;overflow:hidden;animation:rowIn .5s ease both;
  }
  .group-card:hover{transform:translateY(-4px);border-color:rgba(124,78,147,0.45);}
  .group-card::before{
    content:"";position:absolute;inset:auto -20% -40% auto;width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle, rgba(124,78,147,0.28), transparent 70%);pointer-events:none;
  }
  .group-card h3{color:var(--text-light);font-size:1.15rem;margin-bottom:6px;position:relative;}
  .group-card p{color:var(--text-dim);font-size:0.88rem;line-height:1.5;position:relative;}
  .group-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;position:relative;gap:8px;}
  .code-pill{
    font-family:ui-monospace,monospace;letter-spacing:0.12em;background:var(--ink-3);
    border:1px dashed rgba(232,178,61,0.4);color:var(--gold);padding:6px 10px;border-radius:8px;font-size:0.8rem;font-weight:700;
  }
  .group-form{
    background:var(--ink-2);border:1px solid rgba(155,201,127,0.16);border-radius:18px;padding:22px;
    margin-bottom:24px;animation:rowIn .35s ease;
  }
  .group-form h3{margin-bottom:14px;}
  .form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .join-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .join-row input{flex:1;min-width:140px;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(155,201,127,0.18);background:var(--ink-2);color:var(--text-light);text-transform:uppercase;letter-spacing:0.12em;font-weight:700;}
  .social-toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;
    background:var(--ink-2);border:1px solid rgba(155,201,127,0.3);color:var(--text-light);
    padding:12px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,0.4);
    animation:toastIn .35s ease;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
  .profile-avatar{cursor:pointer;}
  .profile-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .profile-avatar .photo-edit{
    position:absolute;inset:0;background:rgba(20,31,23,0.55);display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .2s ease;color:var(--text-light);font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
  }
  .profile-avatar:hover .photo-edit{opacity:1;}
  .profile-bio{color:var(--text-dim);margin-top:8px;max-width:46ch;line-height:1.55;}
  .bio-edit{width:100%;max-width:460px;margin-top:10px;padding:10px 12px;border-radius:10px;border:1.5px solid rgba(155,201,127,0.18);background:var(--ink-3);color:var(--text-light);font-size:0.9rem;resize:vertical;min-height:64px;font-family:var(--font-body);line-height:1.5;}
  .bio-edit.readonly{min-height:auto;cursor:default;}
  .profile-stage{
    position:relative;background:linear-gradient(180deg, rgba(38,57,44,0.55), transparent 220px);
    border:1px solid rgba(155,201,127,0.12);border-radius:24px;padding:0 28px 36px;overflow:hidden;
  }
  .profile-banner{
    height:92px;margin:0 -28px 8px;position:relative;
    background:linear-gradient(110deg, rgba(116,168,91,0.35), rgba(124,78,147,0.28) 55%, rgba(232,178,61,0.18));
  }
  .profile-banner-vine{
    position:absolute;inset:0;
    background:radial-gradient(circle at 18% 120%, rgba(243,238,221,0.16), transparent 40%),
      radial-gradient(circle at 88% -20%, rgba(232,178,61,0.2), transparent 42%);
    animation:bannerShift 8s ease-in-out infinite alternate;
  }
  @keyframes bannerShift{from{transform:translateX(-8px);}to{transform:translateX(8px);}}
  .profile-stage{overflow:visible;}
  .profile-banner{position:relative;}
  .profile-toolbar{
    position:absolute;top:14px;left:16px;right:16px;z-index:6;
    display:flex;align-items:center;pointer-events:none;
  }
  .profile-toolbar .back-btn{pointer-events:auto;margin:0;background:rgba(20,31,23,0.72);}
  .profile-header{margin-top:-48px;position:relative;z-index:2;align-items:flex-start;}
  .profile-copy{min-width:0;flex:1;padding-top:56px;}
  .profile-copy h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere;word-break:break-word;}
  .profile-footer{margin-top:40px;padding-top:24px;border-top:1px solid rgba(155,201,127,0.14);}
  .browse-search{max-width:640px;margin:0 auto 28px;}
  .browse-search input{
    width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid rgba(155,201,127,0.18);
    background:var(--ink-2);color:var(--text-light);font-size:0.95rem;outline:none;
  }
  .browse-search input:focus{border-color:var(--vine-light);} 
  .auth-divider{
    display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--text-dim);font-size:0.78rem;
    letter-spacing:0.08em;text-transform:uppercase;font-weight:600;
  }
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:rgba(155,201,127,0.18);}
  .btn-google{background:#F3EEDD;color:#1B2A1F;border:1px solid rgba(20,31,23,0.08);}
  .btn-google:hover{transform:translateY(-2px);}
  .profile-xp-line{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--text-dim);font-size:0.82rem;font-weight:600;}
  .xp-bar-wrap.profile-xp{width:160px;margin-left:0;}
  .stat-box{transition:transform .2s ease, border-color .2s ease;}
  .stat-box:hover{transform:translateY(-3px);border-color:rgba(155,201,127,0.35);}
  .heat-cell{transition:transform .15s ease, background .2s ease;}
  .heat-cell.on{background:linear-gradient(180deg, var(--vine-light), var(--vine-dark));box-shadow:0 0 8px rgba(116,168,91,0.35);}
  .badge-card{transition:transform .2s ease, opacity .2s ease;}
  .badge-card.earned{box-shadow:0 8px 18px rgba(232,178,61,0.12);transform:translateY(-2px);}
  .clickable-row{cursor:pointer;}
  .member-you{color:var(--gold);font-size:0.78rem;font-weight:600;}
  .empty-illus{font-size:0.9rem;color:var(--text-dim);padding:40px 16px;text-align:center;border:1px dashed rgba(155,201,127,0.2);border-radius:16px;}
  .skel{background:linear-gradient(90deg, var(--ink-2) 0%, var(--ink-3) 50%, var(--ink-2) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:14px;height:56px;margin-bottom:10px;}
  @keyframes shimmer{to{background-position:-200% 0;}}
  .app-main .view-enter.anim{animation:riseIn .4s ease;}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .upload-form{max-width:640px;margin:0 auto;}
  .upload-form .field textarea{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(155,201,127,0.18);
    background:var(--ink-3);color:var(--text-light);font-size:0.95rem;outline:none;resize:vertical;
    min-height:132px;line-height:1.55;
  }
  .upload-form .field textarea:focus{border-color:var(--vine-light);} 
  .recipe-photo-card{margin-bottom:22px;}
  .recipe-photo-drop{
    width:100%;min-height:220px;border-radius:18px;padding:28px 20px;
    border:1.5px dashed rgba(155,201,127,0.35);background:
      radial-gradient(circle at 50% 20%, rgba(116,168,91,0.14), transparent 55%),
      var(--ink-2);
    color:var(--text-light);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    text-align:center;cursor:pointer;transition:border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .recipe-photo-drop:hover{border-color:var(--vine-light);transform:translateY(-2px);} 
  .recipe-photo-icon{
    width:56px;height:56px;border-radius:16px;background:rgba(116,168,91,0.16);
    color:var(--vine-light);display:flex;align-items:center;justify-content:center;margin-bottom:6px;
  }
  .recipe-photo-drop strong{font-size:1.05rem;font-weight:700;}
  .recipe-photo-drop span{color:var(--text-dim);font-size:0.85rem;max-width:32ch;line-height:1.45;}
  .recipe-photo-preview-wrap{
    position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(155,201,127,0.2);
    background:var(--ink-2);aspect-ratio:16/9;
  }
  .recipe-photo-preview-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .recipe-photo-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
  .review-seal{
    display:inline-block;letter-spacing:0.14em;text-transform:uppercase;font-size:0.72rem;font-weight:700;
    color:var(--gold);border:1px solid rgba(232,178,61,0.45);border-radius:999px;padding:6px 12px;margin-bottom:14px;
  }
  .browse-grid{display:flex;flex-wrap:wrap;gap:28px 22px;justify-content:center;max-width:1200px;margin:0 auto;}
  .rank-bar{height:4px;background:var(--ink-3);border-radius:99px;margin-top:8px;overflow:hidden;}
  .rank-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--vine-dark),var(--gold));border-radius:99px;}
 
  /* ---------- Responsive ---------- */
  @media (max-width:860px){
    .hero{grid-template-columns:1fr;padding-top:6vh;}
    .vine-art{height:320px;order:-1;}
    .feature-grid{grid-template-columns:1fr;}
    .plans-grid{grid-template-columns:1fr;}
    .path-preview{flex-direction:column;text-align:center;padding:32px 24px;}
    .path-preview .tier-chip{margin:0 auto;}
    .dish-detail{grid-template-columns:1fr;}
    .dish-banner{height:180px;}
    .dish-banner.compact{height:120px;}
    .scroll-list{max-height:280px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .heatmap{grid-template-columns:repeat(10,1fr);}
    .profile-header{justify-content:center;text-align:center;}
    .profile-copy h2{justify-content:center;}
    .profile-stage{padding:0 16px 28px;}
    .profile-banner{margin:0 -16px 8px;}
    .profile-xp-line{justify-content:center;}
    .dish-node-row{gap:28px;}
    .cooking-header{flex-direction:column;align-items:flex-start;}
    .completed-actions{flex-direction:column;align-items:stretch;}
    .learn-section{padding:22px 18px;}
    .lb-level{display:none;}
    .podium{grid-template-columns:1fr;max-width:280px;}
    .podium-card.p1,.podium-card.p2,.podium-card.p3{order:unset;}
    .app-tabs{padding-bottom:4px;}
    .page-head .social-hero{padding-right:0;padding-top:52px;text-align:center;}
    .page-head .social-hero h2,.page-head .social-hero p{max-width:none;}
    .page-corner-btn{top:0;right:0;}
  }
</style>
